[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "typeset"
version = "0.1.0"
description = "Japanese typesetting library (vertical/horizontal, JLReq) with raster / PDF / SVG backends — C++17 core with pybind11 bindings"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "wamsoft" }]
keywords = ["typesetting", "japanese", "vertical", "pdf", "svg", "ruby"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Fonts",
]

[tool.scikit-build]
# vcpkg の依存（freetype / harfbuzz / libunibreak / zlib / stb）が要るので VCPKG_ROOT を設定して
# CMAKE_TOOLCHAIN_FILE を渡す。glyphware は GLYPHWARE_DIR が無ければ FetchContent で取る
cmake.version = ">=3.24"
cmake.args = [
    "-DTYPESET_BUILD_PYTHON=ON",
    "-DTYPESET_BUILD_SAMPLES=OFF",
    "-DTYPESET_BUILD_TESTS=OFF",
    "-DCMAKE_TOOLCHAIN_FILE=$env{VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake",
]
wheel.packages = []
build-dir = "build/skbuild/{wheel_tag}"

[tool.scikit-build.sdist]
exclude = ["build/", "out/", "data/*.ttf", "data/*.otf", "output*"]
